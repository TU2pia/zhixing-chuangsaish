<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>知行创赛社 · 小游戏中心</title>
<style>
  :root{
    --bg:#05070f;--panel:#0b1020;--line:#1c2740;
    --cyan:#22e0ff;--violet:#8b5cf6;--magenta:#ff4fd8;
    --text:#e8f1ff;--muted:#8aa0c0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:radial-gradient(1200px 800px at 70% -10%,rgba(139,92,246,.18),transparent 60%),
               radial-gradient(1000px 700px at 10% 110%,rgba(34,224,255,.12),transparent 60%),var(--bg);
    color:var(--text);min-height:100vh;font-family:"Segoe UI","Microsoft YaHei",sans-serif;
    padding:30px 16px 60px;
  }
  .top{max-width:960px;margin:0 auto 26px;display:flex;align-items:center;justify-content:space-between}
  .brand{font-family:Consolas,monospace;letter-spacing:2px;font-size:14px;color:var(--cyan)}
  .brand b{color:var(--magenta)}
  .back{color:var(--muted);text-decoration:none;font-size:13px;border:1px solid var(--line);padding:7px 14px;border-radius:8px;transition:.2s}
  .back:hover{color:var(--cyan);border-color:var(--cyan)}
  .hero{text-align:center;margin-bottom:36px}
  .hero .tag{display:inline-block;font-family:Consolas,monospace;font-size:12px;letter-spacing:4px;color:var(--cyan);border:1px solid var(--line);padding:5px 14px;border-radius:20px;margin-bottom:16px}
  .hero h1{font-size:clamp(28px,4.5vw,44px);letter-spacing:4px;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--magenta));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hero p{color:var(--muted);font-size:14px;margin-top:12px;letter-spacing:1px}
  .grid{max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
  .card{
    position:relative;background:rgba(11,16,32,.8);border:1px solid var(--line);border-radius:16px;
    padding:26px 20px;text-align:center;cursor:pointer;overflow:hidden;transition:.25s;display:block;text-decoration:none;color:var(--text);
  }
  .card::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(34,224,255,.12),rgba(139,92,246,.12));opacity:0;transition:.25s}
  .card:hover{transform:translateY(-6px);border-color:var(--cyan);box-shadow:0 14px 34px rgba(34,224,255,.15)}
  .card:hover::before{opacity:1}
  .card .ico{font-size:40px;line-height:1;margin-bottom:14px;position:relative}
  .card h3{font-size:17px;letter-spacing:2px;margin-bottom:8px;position:relative}
  .card p{color:var(--muted);font-size:12px;line-height:1.6;position:relative}
  .card .status{
    position:absolute;top:12px;right:12px;font-size:10px;letter-spacing:2px;color:var(--muted);
    border:1px solid var(--line);padding:2px 8px;border-radius:12px;font-family:Consolas,monospace;
  }
  .card .status.soon{color:#ffd940;border-color:rgba(255,217,64,.4);background:rgba(255,217,64,.06)}
  .card .status.play{color:#3dffa0;border-color:rgba(61,255,160,.4);background:rgba(61,255,160,.06)}
  .card.playable::after{content:"▶";position:absolute;right:14px;bottom:12px;color:var(--cyan);font-size:12px;opacity:.6}
  .toast{
    position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);
    background:var(--panel);border:1px solid var(--cyan);color:var(--text);font-size:13px;
    padding:12px 22px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:20;
    box-shadow:0 8px 30px rgba(34,224,255,.2);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:40px;letter-spacing:1px}
</style>
</head>
<body>
  <div class="top">
    <div class="brand">知行创赛社 <b>·</b> MINI GAME</div>
    <a class="back" href="index.html">← 返回首页</a>
  </div>

  <div class="hero">
    <div class="tag">GAME ARCADE</div>
    <h1>小游戏中心</h1>
    <p>选择一款小游戏，休闲片刻，继续战斗</p>
  </div>

  <div class="grid" id="grid">
    <a class="card playable" href="snake.html">
      <span class="status play">可玩</span>
      <div class="ico">🐍</div>
      <h3>贪吃蛇</h3>
      <p>经典蛇形走位，越吃越长</p>
    </a>
    <a class="card playable" href="plane.html">
      <span class="status play">可玩</span>
      <div class="ico">✈️</div>
      <h3>飞机大战</h3>
      <p>战机出击，横扫敌群</p>
    </a>
    <a class="card playable" href="sokoban.html">
      <span class="status play">可玩</span>
      <div class="ico">📦</div>
      <h3>推箱子</h3>
      <p>开动脑筋，把箱子归位</p>
    </a>
    <a class="card playable" href="street-fighter/index.html">
      <span class="status play">可玩</span>
      <div class="ico">🥊</div>
      <h3>街头霸王</h3>
      <p>经典格斗，一决高下</p>
    </a>
    <a class="card playable" href="mystery.html">
      <span class="status play">可玩</span>
      <div class="ico">🎭</div>
      <h3>神秘挑战</h3>
      <p>不知道玩什么，但很好玩</p>
    </a>
    <div class="card" data-name="2048">
      <span class="status soon">即将上线</span>
      <div class="ico">🧩</div>
      <h3>2048</h3>
      <p>合并数字，冲击 2048 高分</p>
    </div>
    <div class="card" data-name="扫雷">
      <span class="status soon">即将上线</span>
      <div class="ico">💣</div>
      <h3>扫雷</h3>
      <p>排除地雷，步步为营</p>
    </div>
    <div class="card" data-name="反应测试">
      <span class="status soon">即将上线</span>
      <div class="ico">⚡</div>
      <h3>反应测试</h3>
      <p>捕捉瞬间，测测手速</p>
    </div>
  </div>

  <div class="foot">更多小游戏陆续上线 · 敬请期待</div>

  <div class="toast" id="toast"></div>

<script>
(function(){
  var toast=document.getElementById('toast'),timer=null;
  document.getElementById('grid').addEventListener('click',function(e){
    var card=e.target.closest('.card');
    if(!card||card.classList.contains('playable'))return;
    toast.textContent='「'+card.dataset.name+'」敬请期待，即将上线';
    toast.classList.add('show');
    clearTimeout(timer);
    timer=setTimeout(function(){toast.classList.remove('show');},1600);
  });
})();
</script>
</body>
</html>
